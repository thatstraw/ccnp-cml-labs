lab:
  description: AS2 (CSR2) - AS134 transit (CSR1/R3/R4, OSPF core, tagged BGP<->OSPF redistribution) -
    AS12 (R1/R2, iBGP) plus an AS2<->AS12 backdoor. Companion topology for the INE BGP Path Attributes
    video - baseline connectivity is pre-configured, attribute manipulation (Weight, Local Preference,
    AS_PATH, Origin, MED) is left for you to configure while following along.
  notes: "# INE BGP PATH ATTRIBUTES #\n\nCompanion topology for: https://www.youtube.com/watch?v=Ly6wg4PdunM\n\
    \nPre-configured: all addressing, OSPF area 0 across CSR1/R3/R4 (tagged redistribution in and out\
    \ of BGP so AS134 carries reachability without iBGP), iBGP between R1 and R2, and every eBGP/iBGP\
    \ session (no bgp default ipv4-unicast, manual neighbor activate).\n\nNot configured: Weight, Local\
    \ Preference, AS_PATH prepending, Origin or MED - follow the video and configure these yourself as\
    \ each is introduced.\n\nPrefixes to watch:\n  12.12.12.0/24 and 12.21.21.0/24 - originated by both\
    \ R1 and R2, so CSR1 receives each one twice.\n  22.22.22.22/32 - originated by CSR2, reachable from\
    \ AS12 both via the AS134 transit path and via the CSR2<->R2 backdoor."
  title: INE BGP Path Attributes
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
